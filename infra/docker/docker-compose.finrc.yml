# Final-RC acceptance stack — SEPARATE from the running demo (airco_*) and w11.
# Run: docker compose -p finrc -f docker-compose.yml -f docker-compose.finrc.yml --env-file <env> up -d
# Distinct container names, host ports and network; never `down` the demo project.
# Keycloak + auth-service are reused read-only from the demo stack via
# host.docker.internal (token issuance only; no demo containers are modified).
services:
  backend:
    container_name: finrc_backend
    ports: !override
      - "8100:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-ap-southeast-2}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_SKIP_CREATE_BUCKET: ${S3_SKIP_CREATE_BUCKET:-true}
      S3_BUCKET: ${S3_BUCKET:-airco-files}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-airco-reports}
      STORAGE_TYPE: ${STORAGE_TYPE:-supabase-s3}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://host.docker.internal:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-airco-insights}
      KEYCLOAK_ALLOWED_AZP: ${KEYCLOAK_ALLOWED_AZP:-frontend-app}
      API_KEY_ENVIRONMENT: ${API_KEY_ENVIRONMENT:-test}
      API_KEY_RATE_LIMIT_DEFAULT: ${API_KEY_RATE_LIMIT_DEFAULT:-60}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-7}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      STATEMENT_ENGINE_V2_MODE: ${STATEMENT_ENGINE_V2_MODE:-off}
      STATEMENT_ENGINE_V2_SERVE_BANKS: ${STATEMENT_ENGINE_V2_SERVE_BANKS:-}
      STATEMENT_ENGINE_V2_SERVE_TIMEOUT_S: ${STATEMENT_ENGINE_V2_SERVE_TIMEOUT_S:-30}
      STATEMENT_ENGINE_UNIVERSAL_MODE: ${STATEMENT_ENGINE_UNIVERSAL_MODE:-off}
      TEMP_DIR: /app/tmp
      PYTHONUNBUFFERED: "1"

  frontend:
    container_name: finrc_frontend
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8100
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-airco-insights}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-frontend-app}
    ports: !override
      - "3100:3000"
    environment:
      BACKEND_URL: http://backend:8000
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      NEXT_PUBLIC_API_URL: http://localhost:8100
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-airco-insights}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-frontend-app}
    depends_on:
      backend:
        condition: service_started

  redis:
    container_name: finrc_redis
    ports: !override
      - "6381:6379"

  rabbitmq:
    container_name: finrc_rabbitmq
    ports: !override
      - "5674:5672"
      - "15674:15672"
