# R5b verification stack (OCR T4 verification) — SEPARATE project devin_r5.
# Reuses host keycloak (8080) + auth-service (8001) read-only, same as the r5 stack.
# OCR runs in fixture/mock mode: STATEMENT_ENGINE_OCR_URL=mock:/fixtures with the
# fixture dir mounted read-only. No GPU, no model, no third-party OCR.
#
#   docker compose -p devin_r5 --env-file .env \
#     -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.r5b.yml \
#     up -d --build backend frontend
services:
  backend:
    image: r5b-backend
    container_name: r5b_backend
    restart: "no"
    depends_on: !reset
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports: !override
      - "${R5B_BACKEND_PORT:-8701}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-ap-southeast-2}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_SKIP_CREATE_BUCKET: ${S3_SKIP_CREATE_BUCKET:-true}
      S3_BUCKET: ${S3_BUCKET:-airco-files}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-airco-reports}
      STORAGE_TYPE: ${STORAGE_TYPE:-supabase-s3}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://host.docker.internal:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-airco-insights}
      KEYCLOAK_ALLOWED_AZP: ${KEYCLOAK_ALLOWED_AZP:-frontend-app}
      API_KEY_ENVIRONMENT: ${API_KEY_ENVIRONMENT:-test}
      API_KEY_RATE_LIMIT_DEFAULT: ${API_KEY_RATE_LIMIT_DEFAULT:-60}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-7}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
      RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-false}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-30}
      STATEMENT_ENGINE_V2_MODE: ${R5B_V2_MODE:-serve}
      STATEMENT_ENGINE_V2_SERVE_BANKS: ${R5B_SERVE_BANKS:-hdfc,sbi,axis,idfc,paytm,citibank,city_union,au_sfb,bank_of_maharashtra,airtel_pb,iob,apgv,south_indian,pnb,bob,canara,icici,indian_bank,karnataka,kotak,federal,dhanlaxmi}
      STATEMENT_ENGINE_UNIVERSAL_MODE: ${STATEMENT_ENGINE_UNIVERSAL_MODE:-off}
      STATEMENT_ENGINE_MISMATCH_GUARD: ${STATEMENT_ENGINE_MISMATCH_GUARD:-1}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:?set DOWNLOAD_TOKEN_SECRET}
      STATEMENT_ENGINE_OCR_MODE: ${R5B_OCR_MODE:-serve}
      STATEMENT_ENGINE_OCR_URL: ${R5B_OCR_URL:-mock:/fixtures}
      STATEMENT_ENGINE_OCR_DETECT_TIMEOUT_S: ${R5B_OCR_DETECT_TIMEOUT_S:-5}
      TEMP_DIR: /app/tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./r5b_fixtures:/fixtures:ro

  frontend:
    image: r5b-frontend
    container_name: r5b_frontend
    restart: "no"
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${R5B_BACKEND_PORT:-8701}
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-airco-insights}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-frontend-app}
        NEXT_PUBLIC_UNIFIED_ENTRY: ${NEXT_PUBLIC_UNIFIED_ENTRY:-1}
    ports: !override
      - "${R5B_FRONTEND_PORT:-3500}:3000"
    environment:
      BACKEND_URL: http://backend:8000
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      NEXT_PUBLIC_API_URL: http://localhost:${R5B_BACKEND_PORT:-8701}
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-airco-insights}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-frontend-app}
      NEXT_PUBLIC_UNIFIED_ENTRY: ${NEXT_PUBLIC_UNIFIED_ENTRY:-1}

  auth-service:
    container_name: r5b_auth_service
    ports: !override []
    profiles: ["r5b-disabled"]

  keycloak-postgres:
    container_name: r5b_keycloak_postgres
    ports: !override []
    profiles: ["r5b-disabled"]

  keycloak:
    container_name: r5b_keycloak
    ports: !override []
    profiles: ["r5b-disabled"]

  nginx:
    container_name: r5b_nginx
    ports: !override []
    profiles: ["r5b-disabled"]

  redis:
    container_name: r5b_redis
    restart: "no"
    ports: !override []
    volumes: !override []

  rabbitmq:
    container_name: r5b_rabbitmq
    restart: "no"
    ports: !override []
    volumes: !override []
